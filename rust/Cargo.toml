[package]
name = "gputuner"
version = "1.0.0"
edition = "2021"
description = "NVIDIA GPU power, fan and clock daemon for the GPUTuner Unraid plugin"
license = "MIT"

[dependencies]
libc = "0.2"
nvml-wrapper = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
